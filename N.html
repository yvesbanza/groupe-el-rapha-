<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>groupe EL-RAPHA</title>
<style>
body{font-family:system-ui;background:#f6f6f6;margin:0;padding:12px}
.center-title{text-align:center}
.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.btn{padding:12px 16px;border-radius:12px;border:none;font-weight:700;cursor:pointer}
.btn-b{background:#111;color:#fff}
.btn-w{background:#fff;color:#111;border:1px solid #ddd}
.portal-tabs{display:flex;gap:8px;margin:10px 0}
.portal-tab{flex:1}
.stats{display:flex;gap:12px}
.stat{flex:1;border-radius:16px;padding:14px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:999}
.modal.open{display:flex}
.modal-box{background:#fff;border-radius:20px;padding:20px;width:90%;max-width:420px}
</style>
</head>
<body>

<div id="headerPortal" class="center-title"><h2>groupe EL-RAPHA</h2></div>
<div id="headerDG" class="center-title" style="display:none"><h2>groupe EL-RAPHA - Direction</h2></div>

<div id="portal">
  <div class="portal-tabs">
    <button id="btnTabDG" class="btn btn-b portal-tab active" onclick="showPortal('DG')">DG - Direction</button>
    <button id="btnTabEtab" class="btn btn-w portal-tab" onclick="showPortal('ETAB')">Établissements</button>
  </div>

  <div id="paneDG" class="card">
    <h3>Connexion DG</h3>
    <input id="dgEmail" value="dg@elrapha.cd" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc"><br><br>
    <input id="dgPass" type="password" value="12345678" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc"><br><br>
    <button class="btn btn-b" style="width:100%" onclick="loginDG()">Entrer</button>
  </div>

  <div id="paneEtab" class="card" style="display:none">
    <h3>Connexion Établissement</h3>
    <div id="etabCodeSection">
      <input id="etabCode" placeholder="Code Établissement ex: ELR-MAT-2026" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc">
      <div id="msgCodeInvalide" style="display:none;color:red;margin-top:8px">Code invalide</div>
      <button class="btn btn-b" style="width:100%;margin-top:12px" onclick="verifierCodeEtab()">Vérifier</button>
      <div id="nomMaisonTrouvee" style="font-weight:700;margin-top:8px"></div>
    </div>
    <div id="etabRoleChoice" style="display:none;margin-top:16px">
      <button class="btn btn-b" style="width:100%;margin-bottom:8px" onclick="choisirRole('GERANT')">Gérant de la maison</button>
      <button class="btn btn-b" style="width:100%" onclick="choisirRole('CAISSE')">Caisse de la maison</button>
    </div>
    <div id="etabLoginGerant" style="display:none">
      <input id="gerantEmail" placeholder="Email gérant" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc">
      <button class="btn btn-b" style="width:100%;margin-top:10px" onclick="finalLoginGerant()">Entrer Gérant</button>
    </div>
    <div id="etabChoixCaisse" style="display:none"><div id="listeCaissesLogin"></div></div>
    <div id="etabLoginEmail" style="display:none">
      <input id="caissierEmail" placeholder="Email caissier" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc">
      <button class="btn btn-b" style="width:100%;margin-top:10px" onclick="entrerCaisse()">Entrer Caisse</button>
    </div>
    <div id="etabCreationEmail" style="display:none">
      <input id="caissierCreationEmail" placeholder="Créer email accès caisse" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc">
      <button class="btn btn-b" style="width:100%;margin-top:10px" onclick="creerAccesCaisse()">Créer accès</button>
    </div>
  </div>
</div>

<div id="dashDG" style="display:none">
  <div class="stats">
    <div class="stat" style="background:#eef2ff;border:2px solid #c7d2fe"><b id="statGerants">0</b><br><span>Gerant</span></div>
    <div class="stat" style="background:#fffbeb;border:2px solid #fde68a"><b id="statCaisses">0</b><br><span>Caisse</span></div>
  </div>
  <div style="display:flex;gap:10px;margin:12px 0">
    <button class="btn" style="background:#facc15;flex:1" onclick="openMaisonForm()">+ Ajouter Maison</button>
    <button id="btnCountMaison" class="btn" style="background:#facc15;flex:1" onclick="toggleListeMaisons()">0 maison</button>
    <button id="btnCountCaisse" class="btn" style="background:#facc15;flex:1" onclick="toggleCaissesGerant()">0 caisse</button>
  </div>
  <div id="formMaison" style="display:none" class="card">
    <h4>Nouvelle Maison</h4>
    <input id="nNom" placeholder="Nom maison" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc"><br><br>
    <input id="nCodeEtab" placeholder="Code ex: ELR-MAT-2026" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc"><br><br>
    <input id="nTel" placeholder="Tel" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc"><br><br>
    <input id="nAdresse" placeholder="Adresse" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc"><br><br>
    <input id="nGerant" placeholder="Nom Gérant" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc"><br><br>
    <button class="btn btn-b" onclick="ajouterMaison()">Enregistrer</button>
    <button class="btn btn-w" onclick="closeMaisonForm()">Fermer</button>
  </div>
  <div id="listeMaisons" style="margin-top:16px"></div>
</div>

<div id="dashGerant" style="display:none">
  <div class="card">
    <h3 id="gerantTitre"></h3>
    <div id="gerantInfo"></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <div class="stat" style="background:#eef2ff"><b id="gStatCount">0</b><br>Caisses</div>
      <div class="stat" style="background:#dcfce7"><b id="gStatSolde">0</b><br>Solde</div>
      <div class="stat" style="background:#fef3c7"><b id="gStatOps">0</b><br>Ops</div>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="btn btn-b" onclick="openFormCaisse()">+ Nouvelle Caisse</button>
      <button id="btnTopRetour" class="btn btn-w" onclick="retourDG()">Retour DG</button>
      <button id="btnTopLogout" class="btn btn-w" onclick="demanderLogout()">Déconnexion</button>
    </div>
    <div id="formCaisse" style="display:none;margin-top:12px">
      <input id="cCode" placeholder="Code Caisse" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc"><br><br>
      <input id="cNom" placeholder="Nom Caisse" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc"><br><br>
      <button class="btn btn-b" onclick="ajouterCaisse()">Ajouter</button>
      <button class="btn btn-w" onclick="closeFormCaisse()">Fermer</button>
    </div>
    <div id="listeCaissesGerant" style="margin-top:16px"></div>
  </div>
</div>

<div id="dashCaisse" style="display:none" class="card"><h3>Caisse</h3><div id="caisseInfo"></div><button class="btn btn-w" onclick="retourChoixRole()">Retour</button></div>

<div id="modalLogout" class="modal"><div class="modal-box"><h3>Voulez-vous vous déconnecter?</h3><button class="btn btn-b" onclick="confirmerLogout()">Oui</button> <button class="btn btn-w" onclick="closeModalLogout()">Non</button></div></div>

<div id="modalEditMaison" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:center;justify-content:center;z-index:1000">
  <div style="background:#fff;border-radius:20px;padding:20px;width:90%;max-width:420px">
    <h4>Modifier la maison</h4>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
      <input id="editCodeMaison" style="padding:12px;border-radius:8px;border:1px solid #ccc">
      <input id="editNomMaison" style="padding:12px;border-radius:8px;border:1px solid #ccc">
      <input id="editTelMaison" style="padding:12px;border-radius:8px;border:1px solid #ccc">
      <input id="editAdresseMaison" style="padding:12px;border-radius:8px;border:1px solid #ccc">
      <input id="editNomGerant" style="padding:12px;border-radius:8px;border:1px solid #ccc">
    </div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-w" style="flex:1" onclick="closeModalEditMaison()">Fermer</button>
      <button class="btn btn-b" style="flex:1" onclick="saveEditMaison()">Enregistrer</button>
    </div>
  </div>
</div>

<script>
let maisons = JSON.parse(localStorage.getItem('maisons') || localStorage.getItem('elrapha_maisons') || '[]');
let curMaison = null; let curCaisse = null; let curRole = null; let enModeDG = false; let editIndexMaison = -1;
function saveData(){ localStorage.setItem('maisons', JSON.stringify(maisons)); localStorage.setItem('elrapha_maisons', JSON.stringify(maisons)); }

function showPortal(t){
  let paneDG=document.getElementById('paneDG'); let paneEtab=document.getElementById('paneEtab');
  let dashDG=document.getElementById('dashDG'); let dashGerant=document.getElementById('dashGerant'); let dashCaisse=document.getElementById('dashCaisse');
  let btnDG=document.getElementById('btnTabDG'); let btnEtab=document.getElementById('btnTabEtab');
  if(t==='DG'){ if(paneDG) paneDG.style.display='block'; if(paneEtab) paneEtab.style.display='none'; if(dashGerant) dashGerant.style.display='none'; if(dashCaisse) dashCaisse.style.display='none'; if(enModeDG&&dashDG) dashDG.style.display='block'; }
  else { if(paneDG) paneDG.style.display='none'; if(paneEtab) paneEtab.style.display='block'; if(dashDG) dashDG.style.display='none'; if(dashGerant) dashGerant.style.display='none'; if(dashCaisse) dashCaisse.style.display='none'; }
  if(btnDG&&btnEtab){ if(t==='DG'){btnDG.style.background='#111';btnDG.style.color='#fff';btnEtab.style.background='#fff';btnEtab.style.color='#111';} else {btnEtab.style.background='#111';btnEtab.style.color='#fff';btnDG.style.background='#fff';btnDG.style.color='#111';} }
}

function resetEtabLogin(){
  ['etabRoleChoice','etabLoginGerant','etabChoixCaisse','etabCreationEmail','etabLoginEmail','msgCodeInvalide'].forEach(id=>{let el=document.getElementById(id); if(el) el.style.display='none';});
  let code=document.getElementById('etabCode'); if(code) code.value=''; let sec=document.getElementById('etabCodeSection'); if(sec) sec.style.display='block'; let nom=document.getElementById('nomMaisonTrouvee'); if(nom) nom.innerText='';
}

function loginDG(){
  let email=document.getElementById('dgEmail').value.trim(); let pass=document.getElementById('dgPass').value.trim();
  if(email.toLowerCase()!=='dg@elrapha.cd'||pass!=='12345678'){alert('Identifiants DG invalides');return;}
  enModeDG=true; document.getElementById('paneDG').style.display='none'; document.getElementById('portal').style.display='none'; document.getElementById('headerPortal').style.display='none'; document.getElementById('headerDG').style.display='block';
  let d=document.getElementById('dashDG'); d.style.display='block'; d.style.visibility='visible'; renderListeMaisons(); updateStats(); updateCount();
}

function updateStats(){
  let totalG=maisons.length; let totalC=0; maisons.forEach(m=>{if(m.caisses) totalC+=m.caisses.length;});
  let sg=document.getElementById('statGerants'); if(sg) sg.innerText=totalG;
  let sc=document.getElementById('statCaisses'); if(sc) sc.innerText=totalC;
  let bm=document.getElementById('btnCountMaison'); if(bm) bm.innerText=totalG+' maison'+(totalG>1?'s':'');
  let bc=document.getElementById('btnCountCaisse'); if(bc) bc.innerText=totalC+' caisse'+(totalC>1?'s':'');
}
function updateCount(){ updateStats(); }
function toggleListeMaisons(){ let div=document.getElementById('listeMaisons'); if(!div) return; div.style.display='block'; renderListeMaisons(); div.scrollIntoView({behavior:'smooth'}); }

function verifierCodeEtab(){
  let code=document.getElementById('etabCode').value.trim().toLowerCase();
  if(maisons.length===0){ let m=document.getElementById('msgCodeInvalide'); m.style.display='block'; m.innerText='Aucune maison enregistrée'; return; }
  let m=maisons.find(x=> (x.codeEtab||'').toLowerCase()===code || (x.code||'').toLowerCase()===code );
  if(!m){ let mm=document.getElementById('msgCodeInvalide'); mm.style.display='block'; mm.innerText='Code invalide'; return; }
  curMaison=m; document.getElementById('msgCodeInvalide').style.display='none'; document.getElementById('nomMaisonTrouvee').innerText='Code valide: '+m.nom+' ('+(m.codeEtab||m.code)+')'; document.getElementById('etabRoleChoice').style.display='block';
}
function choisirRole(role){ curRole=role; document.getElementById('etabRoleChoice').style.display='none'; if(role==='GERANT'){document.getElementById('etabLoginGerant').style.display='block';} else { if(curMaison.caisses&&curMaison.caisses.length>0){showListeCaissesLogin();} else {alert('Aucune caisse pour cette maison');} } }
function showListeCaissesLogin(){ document.getElementById('etabChoixCaisse').style.display='block'; let div=document.getElementById('listeCaissesLogin'); let html=''; (curMaison.caisses||[]).forEach((c,i)=>{ let status=c.enabled!==false?'<small style="color:green"> active</small>':'<small style="color:red"> désactivée</small>'; html+=`<div onclick="selectCaisseLogin(${i})" style="background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer"><b>${c.nom}</b> - ${c.code} ${status}</div>`; }); div.innerHTML=html; }
function finalLoginGerant(){ let email=document.getElementById('gerantEmail').value.trim(); if(!email){alert('Email gérant obligatoire');return;} document.getElementById('portal').style.display='none'; document.getElementById('headerPortal').style.display='none'; document.getElementById('headerDG').style.display='none'; document.getElementById('dashGerant').style.display='block'; enModeDG=false; showGerant(); }
function showGerant(){ if(!curMaison) return; let idx=maisons.findIndex(x=> (x.codeEtab||x.code)===(curMaison.codeEtab||curMaison.code)); if(idx>=0) curMaison=maisons[idx]; let vraiNombre=(curMaison.caisses||[]).length; let t=document.getElementById('gerantTitre'); if(t) t.innerText=curMaison.nom; let info=document.getElementById('gerantInfo'); if(info) info.innerHTML=`Code: <b>${curMaison.codeEtab||curMaison.code}</b><br>Gérant: ${curMaison.gerant||'-'}`; let cnt=document.getElementById('gStatCount'); if(cnt) cnt.innerText=vraiNombre; try{renderCaissesGerant();}catch(e){} }

function openFormCaisse(){document.getElementById('formCaisse').style.display='block';}
function closeFormCaisse(){document.getElementById('formCaisse').style.display='none';}
function ajouterCaisse(){ let code=document.getElementById('cCode').value.trim(); let nom=document.getElementById('cNom').value.trim(); if(!code||!nom){alert('Code Caisse et Nom obligatoires!');return;} if((curMaison.caisses||[]).some(c=>c.code.toLowerCase()===code.toLowerCase())){alert('Code caisse déjà existant');return;} let newCaisse={code:code,nom:nom,tel:'',email:null,enabled:true,ventes:[],solde:0}; let idx=maisons.findIndex(m=> (m.codeEtab||m.code)===(curMaison.codeEtab||curMaison.code)); if(idx>=0){if(!maisons[idx].caisses) maisons[idx].caisses=[]; maisons[idx].caisses.push(newCaisse); curMaison=maisons[idx];} saveData(); closeFormCaisse(); showGerant(); updateStats(); }
function renderCaissesGerant(){ let div=document.getElementById('listeCaissesGerant'); if(!curMaison.caisses||curMaison.caisses.length===0){div.innerHTML='<div style="color:#888;padding:12px">Aucune caisse</div>';return;} let html=''; curMaison.caisses.forEach((c,i)=>{ let actif=c.enabled!==false; let toggle=actif?`<div onclick="toggleActiveCaisse(${i})" style="cursor:pointer;color:green"> Active</div>`:`<div onclick="toggleActiveCaisse(${i})" style="cursor:pointer;color:red"> Désactivée</div>`; html+=`<div style="background:#fff;border-radius:16px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center"><div><b>${c.nom}</b><br><small>${c.code}</small><br>${toggle}<div id="detailCaisse-${i}" style="display:none;margin-top:8px"></div></div><div style="display:flex;gap:6px;flex-direction:column"><button class="btn btn-w" onclick="voirDetailsVentes(${i})">O</button><button class="btn btn-w" onclick="editCaisse(${i})">E</button><button class="btn btn-w" onclick="supprimerCaisse(${i})" style="color:red">X</button></div></div>`; }); div.innerHTML=html; div.style.display='block'; }
function toggleActiveCaisse(i){ curMaison.caisses[i].enabled=!curMaison.caisses[i].enabled; let idx=maisons.findIndex(m=> (m.codeEtab||m.code)===(curMaison.codeEtab||curMaison.code)); if(idx>=0) maisons[idx].caisses[i].enabled=curMaison.caisses[i].enabled; saveData(); renderCaissesGerant(); updateStats(); }
function voirDetailsVentes(i){ let d=document.getElementById('detailCaisse-'+i); if(!d) return; if(d.style.display==='none'){let c=curMaison.caisses[i]; if(!c.ventes||c.ventes.length===0) d.innerHTML='<i>Aucun mouvement</i>'; else d.innerHTML=c.ventes.map(v=>`<div>${v.date||''} - ${v.montant||0} F</div>`).join(''); d.style.display='block';} else d.style.display='none'; }
function editCaisse(i){ let c=curMaison.caisses[i]; let n=prompt('Modifier Nom:',c.nom); if(n===null) return; let tel=prompt('Modifier Tel:',c.tel||''); if(tel===null) return; c.nom=n.trim(); c.tel=tel.trim(); let idx=maisons.findIndex(m=> (m.codeEtab||m.code)===(curMaison.codeEtab||curMaison.code)); if(idx>=0) maisons[idx].caisses[i]=c; saveData(); renderCaissesGerant(); }
function supprimerCaisse(i){ if(!confirm('Supprimer cette caisse?')) return; curMaison.caisses.splice(i,1); let idx=maisons.findIndex(m=> (m.codeEtab||m.code)===(curMaison.codeEtab||curMaison.code)); if(idx>=0) maisons[idx].caisses=curMaison.caisses; saveData(); renderCaissesGerant(); updateStats(); }
function toggleCaissesGerant(){ let d=document.getElementById('listeCaissesGerant'); if(d){d.style.display='block'; renderCaissesGerant();} }
function selectCaisseLogin(i){ let caisse=curMaison.caisses[i]; if(caisse.enabled===false){alert('Caisse désactivée par le Gérant');return;} curCaisse=caisse; document.getElementById('etabChoixCaisse').style.display='none'; if(curCaisse.email) document.getElementById('etabLoginEmail').style.display='block'; else document.getElementById('etabCreationEmail').style.display='block'; }
function creerAccesCaisse(){ let email=document.getElementById('caissierCreationEmail').value.trim(); if(!email){alert('Email obligatoire');return;} curCaisse.email=email; let idx=maisons.findIndex(m=> (m.codeEtab||m.code)===(curMaison.codeEtab||curMaison.code)); let idxC=maisons[idx].caisses.findIndex(c=>c.code===curCaisse.code); if(idxC>=0) maisons[idx].caisses[idxC].email=email; saveData(); document.getElementById('etabCreationEmail').style.display='none'; entrerCaisse(); }
function entrerCaisse(){ let email=document.getElementById('caissierEmail').value.trim(); if(curCaisse.email&&email.toLowerCase()!==curCaisse.email.toLowerCase()){alert('Email incorrect');return;} document.getElementById('portal').style.display='none'; document.getElementById('dashCaisse').style.display='block'; document.getElementById('caisseInfo').innerText='Caisse '+curCaisse.nom+' - '+curMaison.nom; }

function openMaisonForm(){document.getElementById('formMaison').style.display='block';}
function closeMaisonForm(){document.getElementById('formMaison').style.display='none';}
function ajouterMaison(){ let nom=document.getElementById('nNom').value.trim(); let code=document.getElementById('nCodeEtab').value.trim(); if(!nom||!code){alert('Nom Maison obligatoire');return;} if(maisons.some(m=> (m.codeEtab||'').toLowerCase()===code.toLowerCase())){alert('Code déjà existant');return;} maisons.push({codeEtab:code,code:code,nom:nom,tel:document.getElementById('nTel').value.trim(),adresse:document.getElementById('nAdresse').value.trim(),gerant:document.getElementById('nGerant').value.trim(),caisses:[]}); saveData(); closeMaisonForm(); updateCount(); updateStats(); renderListeMaisons(); }
function renderListeMaisons(){ let div=document.getElementById('listeMaisons'); if(!div) return; if(maisons.length===0){div.innerHTML='<div style="color:#888;padding:12px">Aucune maison</div>';} else {let html=''; maisons.forEach((m,i)=>{html+=`<div style="background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"><div><b>${m.nom}</b><br><small>Code: ${m.codeEtab}</small></div><div><button onclick="editMaison(${i})" style="background:#111;color:#fff;border:none;border-radius:8px;padding:8px 12px">E</button><button onclick="supprimerMaison(${i})" style="background:#ff4444;color:#fff;border:none;border-radius:8px;padding:8px 12px">X</button></div></div>`;}); div.innerHTML=html;} }
function editMaison(idx){ editIndexMaison=idx; let m=maisons[idx]; document.getElementById('editCodeMaison').value=m.codeEtab||m.code||''; document.getElementById('editNomMaison').value=m.nom||''; document.getElementById('editTelMaison').value=m.tel||''; document.getElementById('editAdresseMaison').value=m.adresse||''; document.getElementById('editNomGerant').value=m.gerant||''; document.getElementById('modalEditMaison').style.display='flex'; }
function closeModalEditMaison(){document.getElementById('modalEditMaison').style.display='none'; editIndexMaison=-1;}
function saveEditMaison(){ let idx=editIndexMaison; if(idx<0) return; maisons[idx].codeEtab=document.getElementById('editCodeMaison').value.trim(); maisons[idx].code=maisons[idx].codeEtab; maisons[idx].nom=document.getElementById('editNomMaison').value.trim(); maisons[idx].tel=document.getElementById('editTelMaison').value.trim(); maisons[idx].adresse=document.getElementById('editAdresseMaison').value.trim(); maisons[idx].gerant=document.getElementById('editNomGerant').value.trim(); saveData(); document.getElementById('modalEditMaison').style.display='none'; renderListeMaisons(); updateStats(); updateCount(); }
function supprimerMaison(idx){ if(!confirm("Supprimer la maison "+maisons[idx].nom+" et toutes ses caisses?")) return; maisons.splice(idx,1); saveData(); renderListeMaisons(); updateStats(); updateCount(); alert("Maison supprimée"); }

function retourDG(){ document.getElementById('dashGerant').style.display='none'; document.getElementById('dashCaisse').style.display='none'; document.getElementById('headerDG').style.display='block'; document.getElementById('dashDG').style.display='block'; document.getElementById('portal').style.display='none'; enModeDG=true; updateStats(); renderListeMaisons(); }
function retourChoixRole(){ document.getElementById('dashCaisse').style.display='none'; document.getElementById('portal').style.display='block'; showPortal('ETAB'); resetEtabLogin(); }
function demanderLogout(){document.getElementById('modalLogout').classList.add('open');}
function closeModalLogout(){document.getElementById('modalLogout').classList.remove('open');}
function confirmerLogout(){ document.getElementById('modalLogout').classList.remove('open'); enModeDG=false; curRole=null; curCaisse=null; document.getElementById('dashGerant').style.display='none'; document.getElementById('dashCaisse').style.display='none'; document.getElementById('dashDG').style.display='none'; document.getElementById('headerDG').style.display='none'; document.getElementById('headerPortal').style.display='block'; document.getElementById('portal').style.display='block'; resetEtabLogin(); showPortal('DG'); }

updateStats(); updateCount(); renderListeMaisons();
</script>
</body>
</html>
