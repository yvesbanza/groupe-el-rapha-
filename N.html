<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>groupe EL-RAPHA</title>
<style>
body{font-family:system-ui;background:#f5f5f7;margin:0;padding:14px}
.top-label{text-align:center;color:#8a8a8e;letter-spacing:2px;font-size:12px;font-weight:700;margin:8px 0 14px}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:6px}
.btn-retour{background:#fff;border:1px solid #e5e5e5;border-radius:20px;padding:8px 12px;font-weight:600;cursor:pointer}
.btn-deco{background:#ff3b30;color:#fff;border:none;border-radius:20px;padding:8px 14px;font-weight:700;cursor:pointer}
.select-tz{background:#111;color:#fff;border:none;border-radius:20px;padding:8px 10px;font-size:12px;font-weight:600;flex:1;max-width:220px;cursor:pointer}
/* NOUVEAU TITRE AVEC HEURE AU MILIEU */
.title-dg{text-align:center;margin:10px 0 14px;line-height:1.2}
.title-line1{font-size:18px;font-weight:700}
.title-line2{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-weight:800;font-size:22px}
.time-left{font-size:14px;background:#111;color:#fff;border-radius:10px;padding:4px 8px;min-width:50px;text-align:center}
.date-right{font-size:11px;background:#111;color:#aaa;border-radius:10px;padding:4px 8px;min-width:85px;text-align:center;line-height:1.1}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;border-radius:12px;padding:8px 4px;text-align:center;min-height:48px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.stat b{font-size:16px}
.stat span{font-size:10px;color:#6b7280}
.stat-gerant{background:#eef2ff;border:1.5px solid #c7d2fe}
.stat-caisse{background:#fffbeb;border:1.5px solid #fde68a}
.card-white{background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.btn-yellow{background:#facc15;color:#111;border:none;border-radius:14px;padding:11px 14px;font-weight:800;cursor:pointer;font-size:13px}
.maison-item{background:#fff;border:1px solid #f0f0f0;border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.maison-actions{background:#2b2d33;border-radius:22px;display:flex;padding:4px 6px;gap:6px}
.icon-btn{background:transparent;border:none;cursor:pointer;display:flex;padding:6px}
.portal-tabs{display:flex;gap:8px;margin:10px 0}
.btn{padding:12px 16px;border-radius:12px;border:none;font-weight:700;cursor:pointer}
.btn-b{background:#111;color:#fff}
.btn-w{background:#fff;color:#111;border:1px solid #ddd}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:999}
.modal.open{display:flex}
.modal-box{background:#fff;border-radius:20px;padding:20px;width:90%;max-width:420px}
</style>
</head>
<body>
<div id="headerPortal"><div class="top-label">GROUPE EL-RAPHA</div></div>
<div id="portal">
<div class="portal-tabs"><button class="btn btn-b" style="flex:1" onclick="showPortal('DG')">DG</button><button class="btn btn-w" style="flex:1" onclick="showPortal('ETAB')">Établissements</button></div>
<div id="paneDG" class="card-white"><h3>Connexion DG</h3><input id="dgEmail" value="dg@elrapha.cd" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc"><br><br><input id="dgPass" type="password" value="12345678" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc"><br><br><button class="btn btn-b" style="width:100%" onclick="loginDG()">Entrer</button></div>
<div id="paneEtab" class="card-white" style="display:none"><input id="etabCode" placeholder="Code" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc"><div id="msgCodeInvalide" style="display:none;color:red;margin-top:8px"></div><button class="btn btn-b" style="width:100%;margin-top:12px" onclick="verifierCodeEtab()">Vérifier</button><div id="nomMaisonTrouvee" style="font-weight:700;margin-top:8px"></div><div id="etabRoleChoice" style="display:none;margin-top:12px"><button class="btn btn-b" style="width:100%;margin-bottom:8px" onclick="choisirRole('GERANT')">Gérant</button><button class="btn btn-b" style="width:100%" onclick="choisirRole('CAISSE')">Caisse</button></div><div id="etabLoginGerant" style="display:none"><input id="gerantEmail" placeholder="Email gérant" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc"><button class="btn btn-b" style="width:100%;margin-top:10px" onclick="finalLoginGerant()">Entrer</button></div><div id="etabChoixCaisse" style="display:none"><div id="listeCaissesLogin"></div></div><div id="etabLoginEmail" style="display:none"><input id="caissierEmail" placeholder="Email caissier" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc"><button class="btn btn-b" style="width:100%;margin-top:10px" onclick="entrerCaisse()">Entrer</button></div><div id="etabCreationEmail" style="display:none"><input id="caissierCreationEmail" placeholder="Créer email" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc"><button class="btn btn-b" style="width:100%;margin-top:10px" onclick="creerAccesCaisse()">Créer</button></div></div>
</div>

<div id="dashDG" style="display:none">
<div class="top-label">GROUPE EL-RAPHA</div>
<div class="top-bar">
<button class="btn-retour" onclick="retourPortal()">← Retour</button>
<select id="timezoneSelectDG" class="select-tz" onchange="changeTimezone(this.value)"></select>
<button class="btn-deco" onclick="demanderLogout()">Déconnexion</button>
</div>
<div class="title-dg">
<div class="title-line1">Tableau de bord - Direction</div>
<div class="title-line2">
<span class="time-left" id="clockTitleTimeDG">01:21</span>
<span>Générale</span>
<span class="date-right" id="clockTitleDateDG">dim. 6 sept.<br>2026</span>
</div>
</div>
<div class="stats">
<div class="stat stat-gerant"><b id="statGerants">0</b><span>Gerant</span></div>
<div class="stat stat-caisse"><b id="statCaisses">0</b><span>Caisse</span></div>
</div>
<div class="card-white">
<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn-yellow" onclick="openMaisonForm()">+ Ajouter Maison</button><button id="btnCountMaison" class="btn-yellow" onclick="toggleListeMaisons()">0 maison</button></div>
<div id="formMaison" style="display:none;margin-top:12px"><input id="nNom" placeholder="Nom maison" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc"><br><br><input id="nCodeEtab" placeholder="Code" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc"><br><br><input id="nTel" placeholder="Tel" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc"><br><br><input id="nAdresse" placeholder="Adresse" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc"><br><br><input id="nGerant" placeholder="Nom Gérant" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc"><br><br><button class="btn btn-b" onclick="ajouterMaison()">Enregistrer</button><button class="btn btn-w" onclick="closeMaisonForm()">Fermer</button></div>
<div id="listeMaisons" style="margin-top:12px"></div>
</div>
</div>

<div id="dashGerant" style="display:none">
<div class="top-label">GROUPE EL-RAPHA</div>
<div class="top-bar"><button class="btn-retour" onclick="retourDG()">← Retour</button><select id="timezoneSelectGerant" class="select-tz" onchange="changeTimezone(this.value)"></select><button class="btn-deco" onclick="demanderLogout()">Déconnexion</button></div>
<div class="card-white">
<h3 id="gerantTitre"></h3><div id="gerantInfo"></div>
<div class="stats" style="margin-top:10px">
<div class="stat stat-gerant"><b id="gStatCount">0</b><span>Caisses</span></div>
<div class="stat stat-caisse"><b id="gStatSolde">0</b><span>Solde</span></div>
</div>
<div style="margin-top:12px"><button class="btn-yellow" onclick="openFormCaisse()">+ Nouvelle Caisse</button></div>
<div id="formCaisse" style="display:none;margin-top:12px"><input id="cCode" placeholder="Code Caisse" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc"><br><br><input id="cNom" placeholder="Nom Caisse" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc"><br><br><button class="btn btn-b" onclick="ajouterCaisse()">Ajouter</button><button class="btn btn-w" onclick="closeFormCaisse()">Fermer</button></div>
<div id="listeCaissesGerant" style="margin-top:12px"></div>
</div>
</div>

<div id="dashCaisse" style="display:none" class="card-white"><h3>Caisse</h3><div id="caisseInfo"></div><button class="btn-retour" style="margin-top:10px" onclick="retourChoixRole()">← Retour</button></div>

<div id="modalLogout" class="modal"><div class="modal-box"><h3 style="font-size:17px;font-weight:700;margin:0 0 18px 0">Voulez-vous vous déconnecter?</h3><div style="display:flex;justify-content:space-between"><button class="btn btn-b" style="min-width:90px;border-radius:12px" onclick="confirmerLogout()">Oui</button><button class="btn btn-w" style="min-width:90px;border-radius:12px" onclick="closeModalLogout()">Non</button></div></div></div>
<div id="modalEditMaison" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:center;justify-content:center;z-index:1000"><div style="background:#fff;border-radius:20px;padding:20px;width:90%;max-width:420px"><h4>Modifier la maison</h4><input id="editCodeMaison" style="width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;margin-top:6px"><input id="editNomMaison" style="width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;margin-top:8px"><input id="editTelMaison" style="width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;margin-top:8px"><input id="editAdresseMaison" style="width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;margin-top:8px"><input id="editNomGerant" style="width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;margin-top:8px"><div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-w" style="flex:1" onclick="closeModalEditMaison()">Fermer</button><button class="btn btn-b" style="flex:1" onclick="saveEditMaison()">Enregistrer</button></div></div></div>

<script>
let maisons = JSON.parse(localStorage.getItem('maisons') || localStorage.getItem('elrapha_maisons') || '[]');
let curMaison=null,curCaisse=null,curRole=null,enModeDG=false,editIndexMaison=-1;
let currentTimezone = localStorage.getItem('elrapha_timezone') || 'Africa/Lubumbashi';
const tzFlags = {"Africa/Kinshasa":"🇨🇩","Africa/Lubumbashi":"🇨🇩","Africa/Brazzaville":"🇨🇬","Africa/Lagos":"🇳🇬","Africa/Abidjan":"🇨🇮","Africa/Cairo":"🇪🇬","Africa/Johannesburg":"🇿🇦","Africa/Nairobi":"🇰🇪","Europe/Paris":"🇫🇷","Europe/Brussels":"🇧🇪","Europe/London":"🇬🇧","Europe/Berlin":"🇩🇪","Europe/Madrid":"🇪🇸","Europe/Rome":"🇮🇹","America/New_York":"🇺🇸","America/Montreal":"🇨🇦","Asia/Dubai":"🇦🇪","Asia/Tokyo":"🇯🇵"};
function getFlag(tz){ return tzFlags[tz] || "🌍"; }
function formatTZ(tz){let flag=getFlag(tz);let parts=tz.split('/');let continent=parts[0];let city=parts[parts.length-1].replace(/_/g,' ');return flag+city+"/"+continent;}
function saveData(){localStorage.setItem('maisons',JSON.stringify(maisons));localStorage.setItem('elrapha_maisons',JSON.stringify(maisons));}
function initTimezones(){
  let zones=[]; try{ if(Intl.supportedValuesOf) zones=Intl.supportedValuesOf('timeZone'); }catch(e){}
  if(zones.length===0){ zones=Object.keys(tzFlags); }
  let priority=["Africa/Kinshasa","Africa/Lubumbashi","Africa/Brazzaville","Africa/Lagos","Europe/Paris","Europe/Brussels","Europe/London","America/New_York","Asia/Dubai"];
  zones=[...new Set([...priority,...zones])];
  let selects=[document.getElementById('timezoneSelectDG'),document.getElementById('timezoneSelectGerant')];
  selects.forEach(sel=>{if(!sel) return; sel.innerHTML=''; zones.forEach(z=>{let opt=document.createElement('option'); opt.value=z; opt.textContent=formatTZ(z); if(z===currentTimezone) opt.selected=true; sel.appendChild(opt);});});
}
function changeTimezone(tz){ currentTimezone=tz; localStorage.setItem('elrapha_timezone',tz); updateDateTime(); }
function updateDateTime(){
  let now=new Date();
  try{
    let t=now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',timeZone:currentTimezone,hour12:false});
    let d=now.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short',timeZone:currentTimezone});
    let y=now.toLocaleDateString('fr-FR',{year:'numeric',timeZone:currentTimezone});
    let fullDate=d+"<br>"+y;
    document.getElementById('clockTitleTimeDG').innerText=t;
    document.getElementById('clockTitleDateDG').innerHTML=fullDate;
    // Gerant aussi si besoin
    let elT=document.getElementById('clockTitleTimeGerant'); if(elT) elT.innerText=t;
    let elD=document.getElementById('clockTitleDateGerant'); if(elD) elD.innerHTML=fullDate;
  }catch(e){}
}
setInterval(updateDateTime,1000);
function showPortal(t){let pd=document.getElementById('paneDG'),pe=document.getElementById('paneEtab'),dg=document.getElementById('dashDG'),gr=document.getElementById('dashGerant'),ca=document.getElementById('dashCaisse'); if(t==='DG'){if(pd) pd.style.display='block'; if(pe) pe.style.display='none'; if(gr) gr.style.display='none'; if(ca) ca.style.display='none'; if(enModeDG&&dg) dg.style.display='block';} else {if(pd) pd.style.display='none'; if(pe) pe.style.display='block'; if(dg) dg.style.display='none'; if(gr) gr.style.display='none'; if(ca) ca.style.display='none';}}
function resetEtabLogin(){['etabRoleChoice','etabLoginGerant','etabChoixCaisse','etabCreationEmail','etabLoginEmail','msgCodeInvalide'].forEach(id=>{let el=document.getElementById(id); if(el) el.style.display='none';});}
function loginDG(){let e=document.getElementById('dgEmail').value.trim(),p=document.getElementById('dgPass').value.trim(); if(e.toLowerCase()!=='dg@elrapha.cd'||p!=='12345678'){alert('Identifiants DG invalides');return;} enModeDG=true; document.getElementById('paneDG').style.display='none'; document.getElementById('portal').style.display='none'; document.getElementById('headerPortal').style.display='none'; document.getElementById('dashDG').style.display='block'; renderListeMaisons(); updateStats(); updateDateTime();}
function updateStats(){let g=maisons.length,c=0; maisons.forEach(m=>{if(m.caisses) c+=m.caisses.length;}); document.getElementById('statGerants').innerText=g; document.getElementById('statCaisses').innerText=c; document.getElementById('btnCountMaison').innerText=g+' maison'+(g>1?'s':'');}
function toggleListeMaisons(){let div=document.getElementById('listeMaisons'); if(!div) return; if(div.style.display==='none'||div.style.display===''){div.style.display='block'; renderListeMaisons();} else {div.style.display='none';}}
function verifierCodeEtab(){let code=document.getElementById('etabCode').value.trim().toLowerCase(); if(maisons.length===0){let m=document.getElementById('msgCodeInvalide'); m.style.display='block'; m.innerText='Aucune maison enregistrée'; return;} let m=maisons.find(x=> (x.codeEtab||'').toLowerCase()===code || (x.code||'').toLowerCase()===code ); if(!m){let mm=document.getElementById('msgCodeInvalide'); mm.style.display='block'; mm.innerText='Code invalide'; return;} curMaison=m; document.getElementById('msgCodeInvalide').style.display='none'; document.getElementById('nomMaisonTrouvee').innerText='Code valide: '+m.nom; document.getElementById('etabRoleChoice').style.display='block';}
function choisirRole(role){curRole=role; document.getElementById('etabRoleChoice').style.display='none'; if(role==='GERANT'){document.getElementById('etabLoginGerant').style.display='block';} else { if(curMaison.caisses&&curMaison.caisses.length>0){showListeCaissesLogin();} else {alert('Aucune caisse');} } }
function showListeCaissesLogin(){document.getElementById('etabChoixCaisse').style.display='block'; let div=document.getElementById('listeCaissesLogin'); let h=''; (curMaison.caisses||[]).forEach((c,i)=>{let s=c.enabled!==false?'<small style="color:green"> active</small>':'<small style="color:red"> désactivée</small>'; h+=`<div onclick="selectCaisseLogin(${i})" style="background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer"><b>${c.nom}</b> - ${c.code} ${s}</div>`;}); div.innerHTML=h;}
function finalLoginGerant(){let e=document.getElementById('gerantEmail').value.trim(); if(!e){alert('Email gérant obligatoire');return;} document.getElementById('portal').style.display='none'; document.getElementById('headerPortal').style.display='none'; document.getElementById('dashGerant').style.display='block'; enModeDG=false; showGerant(); updateDateTime();}
function showGerant(){if(!curMaison) return; let idx=maisons.findIndex(x=> (x.codeEtab||x.code)===(curMaison.codeEtab||curMaison.code)); if(idx>=0) curMaison=maisons[idx]; let nb=(curMaison.caisses||[]).length; document.getElementById('gerantTitre').innerText=curMaison.nom; document.getElementById('gerantInfo').innerHTML=`Code: <b>${curMaison.codeEtab||curMaison.code}</b><br>Gérant: ${curMaison.gerant||'-'}`; document.getElementById('gStatCount').innerText=nb; renderCaissesGerant();}
function openFormCaisse(){document.getElementById('formCaisse').style.display='block';}
function closeFormCaisse(){document.getElementById('formCaisse').style.display='none';}
function ajouterCaisse(){let code=document.getElementById('cCode').value.trim(),nom=document.getElementById('cNom').value.trim(); if(!code||!nom){alert('Code et Nom obligatoires');return;} let nc={code,nom,tel:'',email:null,enabled:true,ventes:[],solde:0}; let idx=maisons.findIndex(m=> (m.codeEtab||m.code)===(curMaison.codeEtab||curMaison.code)); if(idx>=0){if(!maisons[idx].caisses) maisons[idx].caisses=[]; maisons[idx].caisses.push(nc); curMaison=maisons[idx];} saveData(); closeFormCaisse(); showGerant(); updateStats();}
function renderCaissesGerant(){let div=document.getElementById('listeCaissesGerant'); if(!curMaison.caisses||curMaison.caisses.length===0){div.innerHTML='<div style="color:#888;padding:12px">Aucune caisse</div>';return;} let html=''; curMaison.caisses.forEach((c,i)=>{html+=`<div class="maison-item"><div><b>${c.nom}</b><br><small>${c.code}</small></div><div class="maison-actions"><button class="icon-btn" onclick="editCaisse(${i})"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button><button class="icon-btn" onclick="supprimerCaisse(${i})"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button></div></div>`;}); div.innerHTML=html;}
function editCaisse(i){let c=curMaison.caisses[i]; let n=prompt('Modifier Nom:',c.nom); if(n!==null){c.nom=n.trim(); saveData(); renderCaissesGerant();}}
function supprimerCaisse(i){if(!confirm('Supprimer cette caisse?')) return; curMaison.caisses.splice(i,1); let idx=maisons.findIndex(m=> (m.codeEtab||m.code)===(curMaison.codeEtab||curMaison.code)); if(idx>=0) maisons[idx].caisses=curMaison.caisses; saveData(); renderCaissesGerant(); updateStats();}
function selectCaisseLogin(i){let c=curMaison.caisses[i]; if(c.enabled===false){alert('Caisse désactivée');return;} curCaisse=c; document.getElementById('etabChoixCaisse').style.display='none'; if(curCaisse.email) document.getElementById('etabLoginEmail').style.display='block'; else document.getElementById('etabCreationEmail').style.display='block';}
function creerAccesCaisse(){let e=document.getElementById('caissierCreationEmail').value.trim(); if(!e){alert('Email obligatoire');return;} curCaisse.email=e; let idx=maisons.findIndex(m=> (m.codeEtab||m.code)===(curMaison.codeEtab||curMaison.code)); let ic=maisons[idx].caisses.findIndex(c=>c.code===curCaisse.code); if(ic>=0) maisons[idx].caisses[ic].email=e; saveData(); document.getElementById('etabCreationEmail').style.display='none'; entrerCaisse();}
function entrerCaisse(){let e=document.getElementById('caissierEmail').value.trim(); if(curCaisse.email&&e.toLowerCase()!==curCaisse.email.toLowerCase()){alert('Email incorrect');return;} document.getElementById('portal').style.display='none'; document.getElementById('dashCaisse').style.display='block'; document.getElementById('caisseInfo').innerText='Caisse '+curCaisse.nom+' - '+curMaison.nom;}
function openMaisonForm(){document.getElementById('formMaison').style.display='block';}
function closeMaisonForm(){document.getElementById('formMaison').style.display='none';}
function ajouterMaison(){let nom=document.getElementById('nNom').value.trim(),code=document.getElementById('nCodeEtab').value.trim(); if(!nom||!code){alert('Nom et Code obligatoires');return;} if(maisons.some(m=> (m.codeEtab||'').toLowerCase()===code.toLowerCase())){alert('Code déjà existant');return;} maisons.push({codeEtab:code,code:code,nom:nom,tel:document.getElementById('nTel').value.trim(),adresse:document.getElementById('nAdresse').value.trim(),gerant:document.getElementById('nGerant').value.trim(),caisses:[]}); saveData(); closeMaisonForm(); renderListeMaisons(); updateStats(); document.getElementById('listeMaisons').style.display='block';}
function renderListeMaisons(){let div=document.getElementById('listeMaisons'); if(!div) return; if(maisons.length===0){div.innerHTML='<div style="color:#888;padding:12px">Aucune maison</div>';} else {let html=''; maisons.forEach((m,i)=>{html+=`<div class="maison-item"><div><b>${m.nom}</b><br><small>Code: ${m.codeEtab}</small></div><div class="maison-actions"><button class="icon-btn" onclick="editMaison(${i})"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button><button class="icon-btn" onclick="supprimerMaison(${i})"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button></div></div>`;}); div.innerHTML=html;}}
function editMaison(idx){editIndexMaison=idx; let m=maisons[idx]; document.getElementById('editCodeMaison').value=m.codeEtab||m.code||''; document.getElementById('editNomMaison').value=m.nom||''; document.getElementById('editTelMaison').value=m.tel||''; document.getElementById('editAdresseMaison').value=m.adresse||''; document.getElementById('editNomGerant').value=m.gerant||''; document.getElementById('modalEditMaison').style.display='flex';}
function closeModalEditMaison(){document.getElementById('modalEditMaison').style.display='none'; editIndexMaison=-1;}
function saveEditMaison(){let idx=editIndexMaison; if(idx<0) return; maisons[idx].codeEtab=document.getElementById('editCodeMaison').value.trim(); maisons[idx].code=maisons[idx].codeEtab; maisons[idx].nom=document.getElementById('editNomMaison').value.trim(); maisons[idx].tel=document.getElementById('editTelMaison').value.trim(); maisons[idx].adresse=document.getElementById('editAdresseMaison').value.trim(); maisons[idx].gerant=document.getElementById('editNomGerant').value.trim(); saveData(); document.getElementById('modalEditMaison').style.display='none'; renderListeMaisons(); updateStats();}
function supprimerMaison(idx){if(!confirm("Supprimer "+maisons[idx].nom+"?")) return; maisons.splice(idx,1); saveData(); renderListeMaisons(); updateStats();}
function retourDG(){document.getElementById('dashGerant').style.display='none'; document.getElementById('dashCaisse').style.display='none'; document.getElementById('dashDG').style.display='block'; document.getElementById('portal').style.display='none'; enModeDG=true; updateStats(); renderListeMaisons(); updateDateTime();}
function retourPortal(){document.getElementById('dashDG').style.display='none'; document.getElementById('dashGerant').style.display='none'; document.getElementById('dashCaisse').style.display='none'; document.getElementById('headerPortal').style.display='block'; document.getElementById('portal').style.display='block'; enModeDG=false; showPortal('DG');}
function retourChoixRole(){document.getElementById('dashCaisse').style.display='none'; document.getElementById('portal').style.display='block'; showPortal('ETAB'); resetEtabLogin();}
function demanderLogout(){document.getElementById('modalLogout').classList.add('open');}
function closeModalLogout(){document.getElementById('modalLogout').classList.remove('open');}
function confirmerLogout(){document.getElementById('modalLogout').classList.remove('open'); enModeDG=false; curRole=null; curCaisse=null; document.getElementById('dashGerant').style.display='none'; document.getElementById('dashCaisse').style.display='none'; document.getElementById('dashDG').style.display='none'; document.getElementById('headerPortal').style.display='block'; document.getElementById('portal').style.display='block'; resetEtabLogin(); showPortal('DG');}

initTimezones(); updateStats(); renderListeMaisons(); updateDateTime();
</script>
</body>
</html>
