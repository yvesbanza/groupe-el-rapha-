<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>groupe EL-RAPHA</title>
<style>
body{font-family:system-ui,-apple-system;background:#f5f5f7;margin:0;padding:14px}
.top-label{text-align:center;color:#8a8a8e;letter-spacing:2px;font-size:12px;font-weight:700;margin:8px 0 14px}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.btn-retour{background:#fff;border:1px solid #e5e5e5;border-radius:20px;padding:8px 16px;font-weight:600;cursor:pointer}
.btn-deco{background:#ff3b30;color:#fff;border:none;border-radius:20px;padding:8px 18px;font-weight:700;cursor:pointer}
.title-dg{text-align:center;font-size:22px;font-weight:800;line-height:1.2;margin:10px 0 16px}
.stats{display:flex;gap:10px;margin-bottom:12px}
.stat{flex:1;border-radius:14px;padding:10px 8px;text-align:center;min-height:58px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.stat b{font-size:18px;display:block;line-height:1.1}
.stat span{font-size:11px;color:#6b7280;margin-top:2px}
.stat-gerant{background:#eef2ff;border:2px solid #c7d2fe}
.stat-caisse{background:#fffbeb;border:2px solid #fde68a}
.card-white{background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.btn-yellow{background:#facc15;color:#111;border:none;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer}
.maison-item{background:#fff;border:1px solid #f0f0f0;border-radius:14px;padding:12px 12px 12px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.maison-actions{background:#2b2d33;border-radius:22px;display:flex;align-items:center;padding:4px 6px;gap:8px}
.icon-btn{background:transparent;border:none;color:#fff;cursor:pointer;padding:6px 8px;display:flex}
.portal-tabs{display:flex;gap:8px;margin:10px 0}
.btn{padding:12px 16px;border-radius:12px;border:none;font-weight:700;cursor:pointer}
.btn-b{background:#111;color:#fff}
.btn-w{background:#fff;color:#111;border:1px solid #ddd}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:999}
.modal.open{display:flex}
.modal-box{background:#fff;border-radius:20px;padding:20px;width:90%;max-width:420px}
</style>
</head>
<body>

<div id="headerPortal"><div class="top-label">GROUPE EL-RAPHA</div></div>

<div id="portal">
  <div class="portal-tabs">
    <button id="btnTabDG" class="btn btn-b" style="flex:1" onclick="showPortal('DG')">DG - Direction</button>
    <button id="btnTabEtab" class="btn btn-w" style="flex:1" onclick="showPortal('ETAB')">Établissements</button>
  </div>
  <div id="paneDG" class="card-white">
    <h3>Connexion DG</h3>
    <input id="dgEmail" value="dg@elrapha.cd" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc"><br><br>
    <input id="dgPass" type="password" value="12345678" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc"><br><br>
    <button class="btn btn-b" style="width:100%" onclick="loginDG()">Entrer</button>
  </div>
  <div id="paneEtab" class="card-white" style="display:none">
    <h3>Connexion Établissement</h3>
    <input id="etabCode" placeholder="Code ex: ELR-MAT-2026" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc">
    <div id="msgCodeInvalide" style="display:none;color:red;margin-top:8px">Code invalide</div>
    <button class="btn btn-b" style="width:100%;margin-top:12px" onclick="verifierCodeEtab()">Vérifier</button>
    <div id="nomMaisonTrouvee" style="font-weight:700;margin-top:8px"></div>
    <div id="etabRoleChoice" style="display:none;margin-top:16px">
      <button class="btn btn-b" style="width:100%;margin-bottom:8px" onclick="choisirRole('GERANT')">Gérant</button>
      <button class="btn btn-b" style="width:100%" onclick="choisirRole('CAISSE')">Caisse</button>
    </div>
    <div id="etabLoginGerant" style="display:none"><input id="gerantEmail" placeholder="Email gérant" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc"><button class="btn btn-b" style="width:100%;margin-top:10px" onclick="finalLoginGerant()">Entrer Gérant</button></div>
    <div id="etabChoixCaisse" style="display:none"><div id="listeCaissesLogin"></div></div>
    <div id="etabLoginEmail" style="display:none"><input id="caissierEmail" placeholder="Email caissier" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc"><button class="btn btn-b" style="width:100%;margin-top:10px" onclick="entrerCaisse()">Entrer Caisse</button></div>
    <div id="etabCreationEmail" style="display:none"><input id="caissierCreationEmail" placeholder="Créer email accès caisse" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc"><button class="btn btn-b" style="width:100%;margin-top:10px" onclick="creerAccesCaisse()">Créer accès</button></div>
  </div>
</div>

<div id="dashDG" style="display:none">
  <div class="top-label">GROUPE EL-RAPHA</div>
  <div class="top-bar">
    <button class="btn-retour" onclick="retourPortal()">← Retour</button>
    <button class="btn-deco" onclick="demanderLogout()">Déconnexion</button>
  </div>
  <div class="title-dg">Tableau de bord - Direction<br>Générale</div>
  <div class="stats">
    <div class="stat stat-gerant"><b id="statGerants">0</b><span>Gerant</span></div>
    <div class="stat stat-caisse"><b id="statCaisses">0</b><span>Caisse</span></div>
  </div>
  <div class="card-white">
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn-yellow" onclick="openMaisonForm()">+ Ajouter Maison</button>
      <button id="btnCountMaison" class="btn-yellow" onclick="toggleListeMaisons()">0 maison</button>
    </div>
    <div id="formMaison" style="display:none;margin-top:12px">
      <input id="nNom" placeholder="Nom maison" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc"><br><br>
      <input id="nCodeEtab" placeholder="Code ex: ELR-MAT-2026" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc"><br><br>
      <input id="nTel" placeholder="Tel" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc"><br><br>
      <input id="nAdresse" placeholder="Adresse" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc"><br><br>
      <input id="nGerant" placeholder="Nom Gérant" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc"><br><br>
      <button class="btn btn-b" onclick="ajouterMaison()">Enregistrer</button>
      <button class="btn btn-w" onclick="closeMaisonForm()">Fermer</button>
    </div>
    <div id="listeMaisons" style="margin-top:12px"></div>
  </div>
</div>

<div id="dashGerant" style="display:none">
  <div class="top-label">GROUPE EL-RAPHA</div>
  <div class="top-bar">
    <button class="btn-retour" onclick="retourDG()">← Retour</button>
    <button class="btn-deco" onclick="demanderLogout()">Déconnexion</button>
  </div>
  <div class="card-white">
    <h3 id="gerantTitre"></h3><div id="gerantInfo"></div>
    <div class="stats" style="margin-top:10px">
      <div class="stat stat-gerant"><b id="gStatCount">0</b><span>Caisses</span></div>
      <div class="stat stat-caisse"><b id="gStatSolde">0</b><span>Solde</span></div>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="btn-yellow" onclick="openFormCaisse()">+ Nouvelle Caisse</button>
    </div>
    <div id="formCaisse" style="display:none;margin-top:12px">
      <input id="cCode" placeholder="Code Caisse" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc"><br><br>
      <input id="cNom" placeholder="Nom Caisse" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc"><br><br>
      <button class="btn btn-b" onclick="ajouterCaisse()">Ajouter</button>
      <button class="btn btn-w" onclick="closeFormCaisse()">Fermer</button>
    </div>
    <div id="listeCaissesGerant" style="margin-top:16px"></div>
  </div>
</div>

<div id="dashCaisse" style="display:none" class="card-white"><h3>Caisse</h3><div id="caisseInfo"></div><button class="btn-retour" style="margin-top:10px" onclick="retourChoixRole()">← Retour</button></div>

<div id="modalLogout" class="modal"><div class="modal-box">
  <h3 style="font-size:17px;font-weight:700;margin:0 0 18px 0">Voulez-vous vous déconnecter?</h3>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
    <button class="btn btn-b" style="min-width:90px;border-radius:12px" onclick="confirmerLogout()">Oui</button>
    <button class="btn btn-w" style="min-width:90px;border-radius:12px" onclick="closeModalLogout()">Non</button>
  </div>
</div></div>

<div id="modalEditMaison" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:center;justify-content:center;z-index:1000"><div style="background:#fff;border-radius:20px;padding:20px;width:90%;max-width:420px"><h4>Modifier la maison</h4><input id="editCodeMaison" style="width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;margin-top:6px"><input id="editNomMaison" style="width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;margin-top:8px"><input id="editTelMaison" style="width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;margin-top:8px"><input id="editAdresseMaison" style="width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;margin-top:8px"><input id="editNomGerant" style="width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;margin-top:8px"><div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-w" style="flex:1" onclick="closeModalEditMaison()">Fermer</button><button class="btn btn-b" style="flex:1" onclick="saveEditMaison()">Enregistrer</button></div></div></div>

<script>
let maisons = JSON.parse(localStorage.getItem('maisons') || localStorage.getItem('elrapha_maisons') || '[]');
let curMaison=null,curCaisse=null,curRole=null,enModeDG=false,editIndexMaison=-1;
function saveData(){localStorage.setItem('maisons',JSON.stringify(maisons));localStorage.setItem('elrapha_maisons',JSON.stringify(maisons));}
function showPortal(t){
  let paneDG=document.getElementById('paneDG'),paneEtab=document.getElementById('paneEtab'),dashDG=document.getElementById('dashDG'),dashGerant=document.getElementById('dashGerant'),dashCaisse=document.getElementById('dashCaisse');
  if(t==='DG'){if(paneDG) paneDG.style.display='block'; if(paneEtab) paneEtab.style.display='none'; if(dashGerant) dashGerant.style.display='none'; if(dashCaisse) dashCaisse.style.display='none'; if(enModeDG&&dashDG) dashDG.style.display='block';}
  else {if(paneDG) paneDG.style.display='none'; if(paneEtab) paneEtab.style.display='block'; if(dashDG) dashDG.style.display='none'; if(dashGerant) dashGerant.style.display='none'; if(dashCaisse) dashCaisse.style.display='none';}
}
function resetEtabLogin(){['etabRoleChoice','etabLoginGerant','etabChoixCaisse','etabCreationEmail','etabLoginEmail','msgCodeInvalide'].forEach(id=>{let el=document.getElementById(id); if(el) el.style.display='none';}); let c=document.getElementById('etabCode'); if(c) c.value='';}
function loginDG(){let e=document.getElementById('dgEmail').value.trim(),p=document.getElementById('dgPass').value.trim(); if(e.toLowerCase()!=='dg@elrapha.cd'||p!=='12345678'){alert('Identifiants DG invalides');return;} enModeDG=true; document.getElementById('paneDG').style.display='none'; document.getElementById('portal').style.display='none'; document.getElementById('headerPortal').style.display='none'; let d=document.getElementById('dashDG'); d.style.display='block'; renderListeMaisons(); updateStats(); updateCount();}
function updateStats(){let g=maisons.length,c=0; maisons.forEach(m=>{if(m.caisses) c+=m.caisses.length;}); document.getElementById('statGerants').innerText=g; document.getElementById('statCaisses').innerText=c; document.getElementById('btnCountMaison').innerText=g+' maison'+(g>1?'s':'');}
function updateCount(){updateStats();}
function toggleListeMaisons(){let d=document.getElementById('listeMaisons'); if(d){d.style.display='block'; renderListeMaisons(); d.scrollIntoView({behavior:'smooth'});}}
function verifierCodeEtab(){let code=document.getElementById('etabCode').value.trim().toLowerCase(); if(maisons.length===0){let m=document.getElementById('msgCodeInvalide'); m.style.display='block'; m.innerText='Aucune maison enregistrée'; return;} let m=maisons.find(x=> (x.codeEtab||'').toLowerCase()===code || (x.code||'').toLowerCase()===code ); if(!m){let mm=document.getElementById('msgCodeInvalide'); mm.style.display='block'; mm.innerText='Code invalide'; return;} curMaison=m; document.getElementById('msgCodeInvalide').style.display='none'; document.getElementById('nomMaisonTrouvee').innerText='Code valide: '+m.nom+' ('+(m.codeEtab||m.code)+')'; document.getElementById('etabRoleChoice').style.display='block';}
