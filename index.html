<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GROUPE EL-RAPHA</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f7;margin:0;padding:0}
.wrap{max-width:480px;margin:auto;padding:16px}
.top{text-align:center;padding:20px 0 10px}
.top h4{margin:0;color:#888;letter-spacing:2px;font-size:12px}
.top h1{margin:6px 0 0;font-size:22px;line-height:1.2;font-weight:800}
.badge{display:inline-block;margin-top:8px;background:#fff;padding:6px 14px;border-radius:20px;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.portal-tabs{display:flex;gap:8px;margin:18px 0}
.btn{padding:12px;border-radius:12px;border:1px solid #ddd;font-weight:700;cursor:pointer}
.btn-b{background:#111;color:#fff;border-color:#111;width:100%}
.btn-w{background:#fff;color:#111;width:100%}
.portal-tab.active{background:#111;color:#fff}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 12px rgba(0,0,0,.06);margin-bottom:16px}
.card h3{margin:0 0 12px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin-bottom:10px;box-sizing:border-box}
.btn-y{background:#ffcc00;border-color:#ffcc00;color:#111;width:auto}
.etab-item{padding:10px;border:1px solid #eee;border-radius:10px;margin-top:6px;background:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
.modal.open{display:flex}
.modal-box{background:#fff;border-radius:16px;padding:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
</style>
</head>
<body>
<div class="wrap">

<div class="top">
<h4>GROUPE EL-RAPHA</h4>
<h1>BIENVENUE<br>SUR LE PORTAIL DE CONNEXION</h1>
<div class="badge">🔒 Accès sécurisé</div>
</div>

<div id="portal">
<div class="portal-tabs">
<button id="tabDG" class="btn btn-b portal-tab active" onclick="showPortal('DG')">DG - Direction</button>
<button id="tabEtab" class="btn btn-w portal-tab" onclick="showPortal('ETAB')">Établissements</button>
</div>

<div id="paneDG" class="card">
<h3>Connexion DG</h3>
<input value="dg@elrapha.cd" placeholder="Email">
<input type="password" value="12345678" placeholder="Mot de passe">
<button class="btn btn-b" onclick="loginDG()">Entrer</button>
</div>

<div id="paneEtab" class="card" style="display:none">
<h3>Connexion Établissement</h3>
<input id="etabCode" placeholder="Code de la maison">
<button class="btn btn-b" onclick="loginEtab()">Entrer</button>
</div>
</div>

<div id="dashDG" style="display:none">
<div class="card">
<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between">
<button class="btn btn-y" onclick="openMaisonForm()">+ Ajouter Maison</button>
<button id="btnCountMaison" class="btn btn-y" onclick="toggleListeMaisons()">0 maison</button>
<button class="btn btn-w" style="width:auto" onclick="logout()">Déconnexion</button>
</div>

<div id="formMaison" style="display:none;margin-top:16px;border-top:1px solid #eee;padding-top:12px">
<input id="mNom" placeholder="Nom Maison">
<input id="mAdresse" placeholder="Adresse">
<input id="mGerant" placeholder="Nom Gérant">
<input id="mTel" placeholder="Téléphone">
<div style="display:flex;gap:8px">
<button class="btn btn-b" onclick="ajouterMaison()">Enregistrer</button>
<button class="btn btn-w" onclick="closeMaisonForm()">Annuler</button>
</div>
</div>

<div id="msgMaison" style="display:none;margin-top:12px" class="card">
<b>Maison ajoutée!</b> Code créé.<br><br>
<button class="btn btn-b" onclick="fermerMsgMaison()">OK</button>
</div>

<div id="listeMaisons" style="display:none;margin-top:12px"></div>
</div>
</div>

<div id="dashGerant" style="display:none">
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<h3 id="gerantTitre">Maison</h3>
<button class="btn btn-w" style="width:auto" onclick="logout()">Déconnexion</button>
</div>
<div id="gerantActions" style="margin:10px 0"></div>
<div id="gerantContent"></div>
</div>
</div>

</div>

<!-- Modals Caisse -->
<div id="modalAddCaisse" class="modal"><div class="modal-box">
<h3>Ajouter Caisse</h3>
<input id="caisseCode" placeholder="Code caisse">
<input id="caisseNomCaissier" placeholder="Nom Caissier(e)">
<input id="caisseTel" placeholder="Téléphone">
<input id="caisseAdr" placeholder="Adresse">
<input id="caisseOutil" placeholder="Outil utilisé">
<input id="caisseNom" placeholder="Nom complet">
<div style="display:flex;gap:8px"><button class="btn btn-b" onclick="saveCaisse()">Enregistrer</button><button class="btn btn-w" onclick="closeAddCaisse()">Fermer</button></div>
</div></div>

<div id="modalListeCaissesV2" class="modal"><div class="modal-box">
<h3>Liste Caisses</h3>
<div id="listeCaissesTrieV2"></div><br>
<button class="btn btn-w" onclick="closeListeV2()">Fermer</button>
</div></div>

<div id="modalDetailCaisseV2" class="modal"><div class="modal-box">
<h3 id="detailCaisseTitleV2">Détail</h3>
<div id="detailCaisseBodyV2"></div><br>
<button class="btn btn-w" onclick="closeDetailV2()">Fermer</button>
</div></div>

<script>
let maisons = JSON.parse(localStorage.getItem('maisons') || '[]');
let curMaison = null;

function showPortal(t){
  document.getElementById('paneDG').style.display = t==='DG'? 'block' : 'none';
  document.getElementById('paneEtab').style.display = t==='ETAB'? 'block' : 'none';
  document.getElementById('tabDG').className = t==='DG'? 'btn btn-b portal-tab active' : 'btn btn-w portal-tab';
  document.getElementById('tabEtab').className = t==='ETAB'? 'btn btn-b portal-tab active' : 'btn btn-w portal-tab';
}
function loginDG(){
  document.getElementById('portal').style.display='none';
  document.getElementById('dashDG').style.display='block';
  updateCount();
  renderListeMaisons();
}
function loginEtab(){
  let code=document.getElementById('etabCode').value.trim();
  let m=maisons.find(x=>x.code===code);
  if(!m){alert('Code invalide');return;}
  curMaison=m;
  document.getElementById('portal').style.display='none';
  document.getElementById('dashGerant').style.display='block';
  showGerant();
}
function logout(){
  document.getElementById('portal').style.display='block';
  document.getElementById('dashDG').style.display='none';
  document.getElementById('dashGerant').style.display='none';
  showPortal('DG');
}
function openMaisonForm(){document.getElementById('formMaison').style.display='block';document.getElementById('msgMaison').style.display='none';}
function closeMaisonForm(){document.getElementById('formMaison').style.display='none';document.getElementById('mNom').value='';document.getElementById('mAdresse').value='';document.getElementById('mGerant').value='';document.getElementById('mTel').value='';}
function ajouterMaison(){
  const nom=document.getElementById('mNom').value.trim();
  const adresse=document.getElementById('mAdresse').value.trim();
  const gerant=document.getElementById('mGerant').value.trim();
  const tel=document.getElementById('mTel').value.trim();
  if(!nom){alert('Entre le Nom de la Maison');return;}
  maisons.push({nom,adresse,gerant,tel,code:nom.toLowerCase().replace(/\s/g,'')+Date.now(),caisses:[]});
  localStorage.setItem('maisons',JSON.stringify(maisons));
  document.getElementById('formMaison').style.display='none';
  document.getElementById('msgMaison').style.display='block';
  updateCount();
}
function fermerMsgMaison(){document.getElementById('msgMaison').style.display='none';closeMaisonForm();renderListeMaisons();}
function updateCount(){
  let el=document.getElementById('btnCountMaison');
  if(!el) return;
  el.innerText=maisons.length+' maison'+(maisons.length>1?'s':'');
}
function toggleListeMaisons(){
  let div=document.getElementById('listeMaisons');
  if(!div) return;
  if(div.style.display==='none'){renderListeMaisons();div.style.display='block';}
  else{div.style.display='none';}
}
function renderListeMaisons(){
  let div=document.getElementById('listeMaisons');
  if(!div) return;
  if(maisons.length===0){div.innerHTML='<div style="color:#888;padding:8px">Aucune maison enregistrée</div>';return;}
  let html='';maisons.forEach((m,i)=>{html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #eee"><span><b>${i+1}.</b> ${m.nom} - ${m.gerant}</span><button onclick="supprimerMaison(${i})" style="background:#ff4444;color:#fff;border:none;padding:6px 10px;border-radius:8px;font-size:12px">Supprimer</button></div>`;});div.innerHTML=html;
}
function supprimerMaison(index){if(confirm('Supprimer cette maison?')){maisons.splice(index,1);localStorage.setItem('maisons',JSON.stringify(maisons));updateCount();renderListeMaisons();}}
function showGerant(){
  if(!curMaison)return;
  document.getElementById('gerantTitre').innerText=curMaison.nom+' - '+curMaison.gerant;
  let nb=(curMaison.caisses||[]).length;
  document.getElementById('gerantActions').innerHTML='<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-y" style="width:auto" onclick="openAddCaisse()">+ Ajouter Caisse</button><button class="btn btn-y" style="width:auto" onclick="openListeV2()">'+nb+' caisse(s)</button></div>';
  renderCaisses();
}
function renderCaisses(){
  let html='';let list=curMaison.caisses||[];for(let i=0;i<list.length;i++){let c=list[i];html+=`<div class="etab-item"><b>${c.code}</b> - ${c.nomCaissier||c.nom||''}</div>`;}
  document.getElementById('gerantContent').innerHTML=html||'<small>Aucune caisse</small>';
}
function openAddCaisse(){document.getElementById('caisseCode').value='';document.getElementById('caisseNomCaissier').value='';document.getElementById('caisseTel').value='';document.getElementById('caisseAdr').value='';document.getElementById('caisseOutil').value='';document.getElementById('caisseNom').value='';document.getElementById('modalAddCaisse').classList.add('open');}
function closeAddCaisse(){document.getElementById('modalAddCaisse').classList.remove('open');}
function saveCaisse(){
  let code=document.getElementById('caisseCode').value.trim();
  let nomCaissier=document.getElementById('caisseNomCaissier').value.trim();
  if(!code){alert('Code obligatoire');return;}
  curMaison.caisses=curMaison.caisses||[];
  curMaison.caisses.push({id:Date.now(),code,nomCaissier,tel:document.getElementById('caisseTel').value.trim(),adr:document.getElementById('caisseAdr').value.trim(),outil:document.getElementById('caisseOutil').value.trim(),nom:document.getElementById('caisseNom').value.trim(),ventes:[]});
  localStorage.setItem('maisons',JSON.stringify(maisons));
  closeAddCaisse();showGerant();
}
function openListeV2(){
  var tri=(curMaison.caisses||[]).slice().sort(function(a,b){return (a.code||'').localeCompare(b.code||'');});
  var html='';if(tri.length===0){html='<small>Aucune caisse</small>';}else{for(var i=0;i<tri.length;i++){var c=tri[i];var nom=c.nomCaissier||c.nom||'';html+='<div class="etab-item" style="margin-top:8px" onclick="showDetailV2('+c.id+')">'+c.code+' - '+nom+'</div>';}}
  document.getElementById('listeCaissesTrieV2').innerHTML=html;
  document.getElementById('modalListeCaissesV2').classList.add('open');
}
function closeListeV2(){document.getElementById('modalListeCaissesV2').classList.remove('open');}
function showDetailV2(id){
  var c=(curMaison.caisses||[]).find(function(x){return x.id==id;});if(!c)return;closeListeV2();
  document.getElementById('detailCaisseTitleV2').innerText=c.code;
  var body='<div style="line-height:1.9"><b>Code caisse:</b> '+c.code+'<br><b>Nom Caissier(e):</b> '+(c.nomCaissier||'')+'<br><b>Telephone:</b> '+(c.tel||'')+'<br><b>Adresse:</b> '+(c.adr||'')+'<br><b>Outil utilise:</b> '+(c.outil||'')+'<br><b>Nom complet:</b> '+(c.nom||'')+'</div>';
  document.getElementById('detailCaisseBodyV2').innerHTML=body;
  document.getElementById('modalDetailCaisseV2').classList.add('open');
}
function closeDetailV2(){document.getElementById('modalDetailCaisseV2').classList.remove('open');}
</script>
</body>
  </html>
