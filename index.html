<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EL-RAPHA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f2f4f8} header{background:#0f172a;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800} .logo span{color:#facc15}
.container{max-width:1000px;margin:0 auto;padding:16px}
.box{max-width:420px;margin:30px auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(0,0,0,.07)}
.tabs{display:flex;background:#eef2f7;border-radius:12px;padding:4px;margin:12px 0}
.tab{flex:1;padding:10px;text-align:center;border-radius:10px;cursor:pointer;font-weight:700;color:#64748b}
.tab.on{background:#0f172a;color:#fff}
.input{width:100%;padding:12px;border:1.5px solid #e2e8f0;border-radius:12px;margin-bottom:10px}
.btn{border:0;padding:12px;border-radius:12px;font-weight:700;cursor:pointer;width:100%}
.btn-d{background:#0f172a;color:#fff}.btn-y{background:#facc15;color:#0f172a}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.hidden{display:none} .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.kpi{background:#f8fafc;padding:10px;border-radius:12px;text-align:center}.kpi.y{background:#fef9c3}
</style></head><body>
<header><div class="logo">GROUPE EL-<span>RAPHA</span></div><div id="h"></div></header>
<div class="container">
<div id="login">
<div class="box">
<h2 style="text-align:center">Portail EL-RAPHA</h2><p style="text-align:center;color:#64748b;font-size:14px">Choisissez votre accès</p>
<div class="tabs"><div id="t1" class="tab on" onclick="tab('dg')">DG - Direction</div><div id="t2" class="tab" onclick="tab('gm')">Gérant Maison</div></div>
<div id="f-dg"><input id="cDG" class="input" type="password" placeholder="Code DG (elrapha2024)"><button class="btn btn-d" onclick="goDG()">Entrer comme DG →</button><p style="text-align:center;font-size:11px;color:#94a3b8;margin-top:6px">Accès total à toutes les maisons</p></div>
<div id="f-gm" class="hidden"><select id="sel" class="input"></select><input id="cGM" class="input" type="password" placeholder="Code maison (ex: 1234)"><button class="btn btn-d" onclick="goGM()">Entrer dans ma Maison →</button></div>
</div></div>

<div id="dg" class="hidden">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><div><h2>Mes Maisons de Vente</h2><p style="color:#64748b;font-size:14px">Gérez toutes vos maisons à distance. Exemple : ETS MATUMONA</p></div><div style="display:flex;gap:8px"><button class="btn btn-y" style="width:auto" onclick="addM()">+ Ajouter Maison</button><button class="btn" style="width:auto;background:#fff" onclick="out()">Quitter</button></div></div>
<div id="list" style="margin-top:16px"></div>
</div>

<div id="gmview" class="hidden">
<div id="gmHead"></div><div id="gmList" style="margin-top:14px"></div>
</div>
</div>

<script>
let maisons=JSON.parse(localStorage.getItem('el_v3')||'[]');
if(maisons.length==0){maisons=[{id:1,nom:'ETS. MATUMONA',act:'Vente matériaux & divers',adr:'Kinshasa - Limete',ger:'Gérant Matumona',tel:'+243 000 000 000',code:'1234',stock:156,ventes:12}];localStorage.setItem('el_v3',JSON.stringify(maisons))}
let cur=null; let mode='dg';
function tab(m){mode=m;document.getElementById('t1').className=m=='dg'?'tab on':'tab';document.getElementById('t2').className=m=='gm'?'tab on':'tab';document.getElementById('f-dg').className=m=='dg'?'':'hidden';document.getElementById('f-gm').className=m=='gm'?'':'hidden';if(m=='gm')fill();}
function fill(){document.getElementById('sel').innerHTML=maisons.map(x=>`<option value="${x.id}">${x.nom}</option>`).join('')}
function goDG(){let c=document.getElementById('cDG').value;if(c!='elrapha2024' && c!=''){alert('Code faux. Utilise: elrapha2024');return}document.getElementById('login').classList.add('hidden');document.getElementById('dg').classList.remove('hidden');document.getElementById('h').innerHTML='DG';renderDG();}
function renderDG(){document.getElementById('list').innerHTML=maisons.map(m=>`<div class="card"><div style="display:flex;justify-content:space-between"><h3>${m.nom}</h3><span onclick="del(${m.id})" style="cursor:pointer">🗑️</span></div><span style="background:#f1f5f9;padding:4px 10px;border-radius:20px;font-size:12px">${m.act}</span><p style="margin:8px 0;color:#64748b;font-size:13px">📍 ${m.adr}<br><b>Gérant:</b> ${m.ger} <br><b>Tel:</b> ${m.tel} - Code: ${m.code}</p><div class="grid"><div class="kpi"><b>${m.stock}</b><br>Stock</div><div class="kpi y"><b>${m.ventes}</b><br>Ventes</div></div><button class="btn btn-d" onclick="openM(${m.id})">Gérer →</button></div>`).join('')}
function del(id){if(confirm('Supprimer?')){maisons=maisons.filter(x=>x.id!=id);localStorage.setItem('el_v3',JSON.stringify(maisons));renderDG();}}
function addM(){let nom=prompt('Nom maison:');if(!nom)return;let act=prompt('Activité:')||'';let adr=prompt('Adresse:')||'';let ger=prompt('Gérant:')||'';let tel=prompt('Tel:')||'';let code=prompt('Code gérant 4 chiffres:')||'1234';maisons.push({id:Date.now(),nom,act,adr,ger,tel,code,stock:0,ventes:0});localStorage.setItem('el_v3',JSON.stringify(maisons));renderDG();fill();}
function openM(id){cur=maisons.find(x=>x.id==id);document.getElementById('dg').classList.add('hidden');document.getElementById('gmview').classList.remove('hidden');document.getElementById('gmHead').innerHTML=`<button class="btn" style="width:auto;background:#fff" onclick="backDG()">← Retour</button><h2 style="margin-top:10px">${cur.nom}</h2><p>${cur.ger} - ${cur.adr}</p><div class="grid" style="max-width:300px"><div class="kpi"><b>${cur.stock}</b><br>Stock</div><div class="kpi y"><b>${cur.ventes}</b><br>Ventes</div></div>`;document.getElementById('gmList').innerHTML=`<div class="card"><p>Bienvenue dans l'espace de gestion de <b>${cur.nom}</b>. Ici tu pourras ajouter produits, ventes, bilan.</p><button class="btn btn-y" onclick="alert('Module Stock bientôt!')">+ Ajouter Produit</button></div>`}
function backDG(){document.getElementById('gmview').classList.add('hidden');document.getElementById('dg').classList.remove('hidden');renderDG();}
function goGM(){let id=parseInt(document.getElementById('sel').value);let c=document.getElementById('cGM').value;let m=maisons.find(x=>x.id==id);if(!m){alert('Choisis une maison');return}if(m.code!=c){alert('Code incorrect');return}cur=m;document.getElementById('login').classList.add('hidden');document.getElementById('gmview').classList.remove('hidden');openM(id);}
function out(){document.getElementById('dg').classList.add('hidden');document.getElementById('gmview').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('h').innerHTML='';}
fill();
</script>
</body></html>
